# Portal template: HR / L&D family (fork-local)
#
# Used by: candidates whose archetypes in templates/archetypes.yml are `family: hr`.
# During intake, copy this file to `portals.yml` (user layer, gitignored) and
# refine location_filter with the candidate's target countries/cities.
#
# Turkish job sites (Kariyer.net, LinkedIn, Indeed) are NOT scannable — for those
# the flow is "paste the URL / JD → evaluate". This file only covers boards the
# scanner can read.
#
# Every tracked_companies entry below was resolved and confirmed live with
# `node discover-ats.mjs` on 2026-11-12 (job counts shown in notes).
# Re-check periodically with `node audit-portals.mjs`.

title_filter:
  positive:
    # ld-training-facilitation
    - "Learning & Development"
    - "Learning and Development"
    - "L&D"
    - "Training"
    - "Trainer"
    - "Facilitator"
    - "Learning Specialist"
    - "Learning Partner"
    - "Enablement"
    # leadership-talent-assessment
    - "Leadership Development"
    - "Talent Development"
    - "Talent Management"
    - "Assessment"
    - "Psychometric"
    # org-development-consultant
    - "Organizational Development"
    - "Organisational Development"
    - "Organizational Effectiveness"
    - "Employee Experience"
    - "Culture"
    - "People Development"
    # ld-vendor-client-roles
    - "Learning Consultant"
    - "Client Success"
    - "Customer Success"
    - "Client Partner"
    # wellbeing-eap
    - "Wellbeing"
    - "Well-being"
    - "Mental Health"
    - "EAP"
    # learning-experience-design (stretch)
    - "Learning Experience"
    - "Instructional Design"
    - "Learning Designer"
    # Turkish titles (for TR-language boards)
    - "Eğitim"
    - "Gelişim"
    - "Yetenek"
  negative:
    - "Intern"
    - "Internship"
    - "Stajyer"
    - "Working Student"
    - "Werkstudent"
    - "Director"
    - "Vice President"
    - "VP "
    - "Head of"
    - "Chief"
    - "Engineer"
    - "Developer"
    # Abroad, clinical titles require local licensure (see archetype wellbeing-eap)
    - "Clinical Psychologist"
    - "Therapist"
    - "Psychiatrist"

# Draft allow-list: Turkey + EU hubs + remote. Narrow it during intake.
location_filter:
  always_allow:
    - "Turkey"
    - "Türkiye"
    - "Turkiye"
  allow:
    - "Istanbul"
    - "İstanbul"
    - "Ankara"
    - "Izmir"
    - "İzmir"
    - "Remote"
    - "EMEA"
    - "Europe"
    - "Netherlands"
    - "Amsterdam"
    - "Germany"
    - "Berlin"
    - "Spain"
    - "Barcelona"
    - "Portugal"
    - "Lisbon"
    - "Ireland"
    - "Dublin"
    - "United Kingdom"
    - "London"
    - "Poland"
    - "Warsaw"

max_posting_age_days: 45

