# Portal template: Tech family (fork-local)
#
# Used by: candidates whose archetypes in templates/archetypes.yml are `family: tech`.
# During intake, copy this file to `portals.yml` (user layer, gitignored) and
# refine location_filter with the candidate's target countries/cities.
#
# Turkish job sites (Kariyer.net, LinkedIn, Indeed) are NOT scannable — for those
# the flow is "paste the URL / JD → evaluate". This file only covers boards the
# scanner can read.
#
# Every tracked_companies entry below was resolved and confirmed live with
# `node discover-ats.mjs` on 2026-11-12 (job counts shown in notes).
# Re-check periodically with `node audit-portals.mjs`.

title_filter:
  positive:
    # backend-fullstack-node
    - "Backend"
    - "Back-end"
    - "Full Stack"
    - "Fullstack"
    - "Full-Stack"
    - "Node"
    - "TypeScript"
    - "Software Engineer"
    - "Software Developer"
    - "Product Engineer"
    # cloud-serverless
    - "Cloud"
    - "Serverless"
    - "Platform Engineer"
    - "Data Engineer"
    - "Integration"
    # ai-llm-application
    - "AI Engineer"
    - "AI"
    - "LLM"
    - "GenAI"
    - "Applied AI"
    - "Agent"
    - "Forward Deployed"
    # iot-signage-media
    - "IoT"
    - "Signage"
    - "Media"
    - "Video"
    - "Streaming"
    # Turkish titles
    - "Yazılım"
  negative:
    - "Intern"
    - "Internship"
    - "Stajyer"
    - "Working Student"
    - "Principal"
    - "Staff"
    - "Director"
    - "Head of"
    - "Manager"
    - "VP "
    - "iOS"
    - "Android Engineer"
    - "Sales"
    - "Recruiter"
    - "Account Executive"

# Draft allow-list: Turkey + EU + remote. Narrow it during intake.
location_filter:
  always_allow:
    - "Turkey"
    - "Türkiye"
    - "Turkiye"
  allow:
    - "Istanbul"
    - "İstanbul"
    - "Ankara"
    - "Izmir"
    - "İzmir"
    - "Remote"
    - "EMEA"
    - "Europe"
    - "Netherlands"
    - "Amsterdam"
    - "Germany"
    - "Berlin"
    - "Spain"
    - "Portugal"
    - "Ireland"
    - "United Kingdom"
    - "London"
    - "Poland"

max_posting_age_days: 45

